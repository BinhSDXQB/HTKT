<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 2370" width="1100" height="2370" font-family="Arial, 'Segoe UI', sans-serif">
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334"/></marker></defs>
<style>
 text{fill:#1d2733}
 .title{font-size:26px;font-weight:700}
 .sub{font-size:16px;fill:#3b4a5a}
 .date{font-size:13px;fill:#6B4BA8}
 .b{font-weight:700}
 .kq{fill:#1f4e79}
 .cc{fill:#5a6573}
 .lbl{fill:#6B4BA8;font-weight:700}
 .arrow{stroke:#334;stroke-width:1.6;marker-end:url(#m)}
 .dash{stroke:#2F6FAE;stroke-width:1.3;stroke-dasharray:5 4}
 .loop{fill:none;stroke:#6B4BA8;stroke-width:1.6;stroke-dasharray:7 4;marker-end:url(#m)}
</style>
<rect width="100%" height="100%" fill="#fff"/>
<text x="550" y="44" text-anchor="middle" class="title">PC-10 · KHẢO SÁT XÂY DỰNG</text><text x="550" y="72" text-anchor="middle" class="sub">Luật Xây dựng 135/2025/QH15 (Đ21, 22, 37, 88) · NĐ 217/2026/NĐ-CP (Đ10–15) · NĐ 212/2026/NĐ-CP</text><text x="550" y="96" text-anchor="middle" class="date">Ngày chốt pháp lý: 13/10/2026 · Dựng từ văn bản pháp luật — chờ đối chiếu với 03 ảnh gốc</text><rect x="90" y="124" width="22" height="16" rx="3" fill="#E6F1FB" stroke="#2F6FAE" /><text x="120" y="137" font-size="13" class="cc">Công việc</text><rect x="223" y="124" width="22" height="16" rx="3" fill="#EFE7FA" stroke="#6B4BA8" /><text x="253" y="137" font-size="13" class="cc">Điều kiện / quyết định</text><rect x="447" y="124" width="22" height="16" rx="3" fill="#FFF6D6" stroke="#B8901F" /><text x="477" y="137" font-size="13" class="cc">Lưu ý</text><rect x="552" y="124" width="22" height="16" rx="3" fill="#FFFFFF" stroke="#2F6FAE" stroke-dasharray="5 3"/><text x="582" y="137" font-size="13" class="cc">Bước tùy chọn (không bắt buộc)</text><rect x="210" y="164" width="560" height="120" rx="8" fill="#E6F1FB" stroke="#2F6FAE" stroke-width="1.4" /><text x="222" y="191" class="b" font-size="15">10.1 · CĐT hoặc CQCBDA</text><text x="222" y="211" class="" font-size="15">Xác định yêu cầu khảo sát theo loại, cấp công trình, bước thiết kế;</text><text x="222" y="231" class="" font-size="15">xem xét kết quả khảo sát đã có (nếu có).</text><text x="222" y="251" class="kq" font-size="15">→ Yêu cầu khảo sát</text><text x="222" y="271" class="cc" font-size="13">Căn cứ: Đ22 k1 Luật 135; Đ11 k6 NĐ 217</text><line x1="490" y1="284" x2="490" y2="308" class="arrow"/><rect x="210" y="312" width="560" height="140" rx="8" fill="#E6F1FB" stroke="#2F6FAE" stroke-width="1.4" /><text x="222" y="339" class="b" font-size="15">10.2 · CĐT/CQCBDA tự lập, hoặc thuê/giao tổ chức, cá nhân có chuyên</text><text x="222" y="359" class="b" font-size="15">môn thiết kế hoặc khảo sát</text><text x="222" y="379" class="" font-size="15">Lập nhiệm vụ khảo sát: mục đích, phạm vi, tiêu chuẩn áp dụng, sơ bộ</text><text x="222" y="399" class="" font-size="15">khối lượng, dự toán (nếu có), thời gian.</text><text x="222" y="419" class="kq" font-size="15">→ Dự thảo nhiệm vụ khảo sát</text><text x="222" y="439" class="cc" font-size="13">Căn cứ: Đ11 k2, k4 NĐ 217</text><line x1="490" y1="452" x2="490" y2="476" class="arrow"/><rect x="210" y="480" width="560" height="120" rx="8" fill="#E6F1FB" stroke="#2F6FAE" stroke-width="1.4" /><text x="222" y="507" class="b" font-size="15">10.3 · CĐT hoặc CQCBDA</text><text x="222" y="527" class="" font-size="15">PHÊ DUYỆT nhiệm vụ khảo sát (bằng văn bản hoặc phê duyệt trực tiếp</text><text x="222" y="547" class="" font-size="15">tại nhiệm vụ).</text><text x="222" y="567" class="kq" font-size="15">→ Nhiệm vụ khảo sát được phê duyệt</text><text x="222" y="587" class="cc" font-size="13">Căn cứ: Đ11 k3 NĐ 217</text><line x1="490" y1="600" x2="490" y2="624" class="arrow"/><rect x="210" y="628" width="560" height="160" rx="8" fill="#E6F1FB" stroke="#2F6FAE" stroke-width="1.4" /><text x="222" y="655" class="b" font-size="15">10.4 · CĐT</text><text x="222" y="675" class="" font-size="15">Lựa chọn nhà thầu khảo sát, ký hợp đồng. Chủ nhiệm khảo sát có chứng</text><text x="222" y="695" class="" font-size="15">chỉ hành nghề phù hợp; năng lực tổ chức tra cứu trên csdlhdxd.gov.vn.</text><text x="222" y="715" class="" font-size="15">Dự án thuộc phạm vi Luật Đấu thầu thì lựa chọn theo pháp luật đấu</text><text x="222" y="735" class="" font-size="15">thầu.</text><text x="222" y="755" class="kq" font-size="15">→ Hợp đồng khảo sát</text><text x="222" y="775" class="cc" font-size="13">Căn cứ: Đ88 Luật 135; Đ28, 34, 41 NĐ 212; NĐ 214/2025 (sửa bởi NĐ 349/2026)</text><line x1="490" y1="788" x2="490" y2="812" class="arrow"/><rect x="210" y="816" width="560" height="140" rx="8" fill="#E6F1FB" stroke="#2F6FAE" stroke-width="1.4" /><text x="222" y="843" class="b" font-size="15">10.5 · Nhà thầu khảo sát</text><text x="222" y="863" class="" font-size="15">Lập phương án kỹ thuật khảo sát phù hợp nhiệm vụ đã duyệt (khối</text><text x="222" y="883" class="" font-size="15">lượng, phương pháp, thiết bị, tiêu chuẩn, kiểm soát chất lượng, tiến</text><text x="222" y="903" class="" font-size="15">độ, an toàn, môi trường).</text><text x="222" y="923" class="kq" font-size="15">→ Phương án kỹ thuật khảo sát</text><text x="222" y="943" class="cc" font-size="13">Căn cứ: Đ12 k1, k2 NĐ 217</text><line x1="490" y1="956" x2="490" y2="980" class="arrow"/><rect x="210" y="984" width="560" height="120" rx="8" fill="#E6F1FB" stroke="#2F6FAE" stroke-width="1.4" /><text x="222" y="1011" class="b" font-size="15">10.6 · CĐT hoặc CQCBDA</text><text x="222" y="1031" class="" font-size="15">KIỂM TRA phương án (hoặc thuê tư vấn THẨM TRA), sau đó PHÊ DUYỆT theo</text><text x="222" y="1051" class="" font-size="15">hợp đồng.</text><text x="222" y="1071" class="kq" font-size="15">→ Kết quả kiểm tra/thẩm tra</text><text x="222" y="1091" class="cc" font-size="13">Căn cứ: Đ12 k3 NĐ 217</text><line x1="490" y1="1104" x2="490" y2="1128" class="arrow"/><polygon points="490,1132 690,1187 490,1242 290,1187" fill="#EFE7FA" stroke="#6B4BA8" stroke-width="1.6"/><text x="490" y="1192" text-anchor="middle" font-size="14" class="b">Phương án đạt yêu cầu, được phê duyệt?</text><text x="498" y="1262" font-size="13" class="lbl">Có</text><line x1="490" y1="1242" x2="490" y2="1266" class="arrow"/><rect x="210" y="1270" width="560" height="120" rx="8" fill="#E6F1FB" stroke="#2F6FAE" stroke-width="1.4" /><text x="222" y="1297" class="b" font-size="15">10.7 · Nhà thầu khảo sát</text><text x="222" y="1317" class="" font-size="15">Thực hiện khảo sát đúng phương án đã duyệt; chủ nhiệm khảo sát đủ</text><text x="222" y="1337" class="" font-size="15">điều kiện; kiểm soát chất lượng, an toàn, môi trường.</text><text x="222" y="1357" class="kq" font-size="15">→ Số liệu khảo sát, mẫu thí nghiệm</text><text x="222" y="1377" class="cc" font-size="13">Căn cứ: Đ13 k1 NĐ 217; Đ22 k3 Luật 135</text><rect x="800" y="1270" width="280" height="160" rx="8" fill="#FFFFFF" stroke="#2F6FAE" stroke-dasharray="6 4"/><text x="812" y="1297" class="b" font-size="15">Giám sát khảo sát — tùy quy mô,</text><text x="812" y="1317" class="b" font-size="15">loại hình</text><text x="812" y="1337" class="" font-size="15">CĐT tự giám sát hoặc thuê tổ</text><text x="812" y="1357" class="" font-size="15">chức, cá nhân phù hợp. CĐT/CQCBDA</text><text x="812" y="1377" class="" font-size="15">được đình chỉ khi nhà thầu làm</text><text x="812" y="1397" class="" font-size="15">sai phương án, hợp đồng.</text><text x="812" y="1417" class="cc" font-size="13">Căn cứ: Đ13 k2, k3 NĐ 217</text><line x1="770" y1="1296" x2="800" y2="1296" class="dash"/><line x1="490" y1="1390" x2="490" y2="1430" stroke="#334" stroke-width="1.6"/><line x1="490" y1="1430" x2="490" y2="1454" class="arrow"/><polygon points="490,1458 690,1513 490,1568 290,1513" fill="#EFE7FA" stroke="#6B4BA8" stroke-width="1.6"/><text x="490" y="1508.5" text-anchor="middle" font-size="14" class="b">Phát hiện yếu tố khác thường, hoặc nhiệm</text><text x="490" y="1527.5" text-anchor="middle" font-size="14" class="b">vụ thiết kế thay đổi?</text><text x="698" y="1537" font-size="12.5" class="cc">Căn cứ: Đ11 k5 a NĐ 217; Đ37 k2 b Luật 135</text><text x="498" y="1588" font-size="13" class="lbl">Không</text><line x1="490" y1="1568" x2="490" y2="1592" class="arrow"/><rect x="210" y="1596" width="560" height="120" rx="8" fill="#E6F1FB" stroke="#2F6FAE" stroke-width="1.4" /><text x="222" y="1623" class="b" font-size="15">10.8 · Nhà thầu khảo sát</text><text x="222" y="1643" class="" font-size="15">Lập Báo cáo kết quả khảo sát: căn cứ, điều kiện tự nhiên, phương</text><text x="222" y="1663" class="" font-size="15">pháp, khối lượng, số liệu, phân tích, kiến nghị, kết luận, phụ lục.</text><text x="222" y="1683" class="kq" font-size="15">→ Báo cáo kết quả khảo sát</text><text x="222" y="1703" class="cc" font-size="13">Căn cứ: Đ14 NĐ 217</text><rect x="800" y="1596" width="280" height="140" rx="8" fill="#FFFFFF" stroke="#2F6FAE" stroke-dasharray="6 4"/><text x="812" y="1623" class="b" font-size="15">Kiểm tra báo cáo (không bắt buộc)</text><text x="812" y="1643" class="" font-size="15">CĐT/CQCBDA được yêu cầu nhà thầu</text><text x="812" y="1663" class="" font-size="15">thiết kế độc lập, hoặc thuê tổ</text><text x="812" y="1683" class="" font-size="15">chức tư vấn KIỂM TRA báo cáo làm</text><text x="812" y="1703" class="" font-size="15">cơ sở phê duyệt.</text><text x="812" y="1723" class="cc" font-size="13">Căn cứ: Đ15 k1 NĐ 217</text><line x1="770" y1="1622" x2="800" y2="1622" class="dash"/><line x1="490" y1="1716" x2="490" y2="1736" stroke="#334" stroke-width="1.6"/><line x1="490" y1="1736" x2="490" y2="1760" class="arrow"/><rect x="210" y="1764" width="560" height="120" rx="8" fill="#E6F1FB" stroke="#2F6FAE" stroke-width="1.4" /><text x="222" y="1791" class="b" font-size="15">10.9 · CĐT hoặc CQCBDA</text><text x="222" y="1811" class="" font-size="15">NGHIỆM THU, PHÊ DUYỆT Báo cáo kết quả khảo sát (bằng văn bản hoặc phê</text><text x="222" y="1831" class="" font-size="15">duyệt trực tiếp tại báo cáo).</text><text x="222" y="1851" class="kq" font-size="15">→ Kết quả nghiệm thu</text><text x="222" y="1871" class="cc" font-size="13">Căn cứ: Đ10 k4, Đ15 k1 NĐ 217; Đ22 k4 Luật 135</text><line x1="490" y1="1884" x2="490" y2="1908" class="arrow"/><polygon points="490,1912 690,1967 490,2022 290,1967" fill="#EFE7FA" stroke="#6B4BA8" stroke-width="1.6"/><text x="490" y="1962.5" text-anchor="middle" font-size="14" class="b">Báo cáo kết quả khảo sát đạt, được phê</text><text x="490" y="1981.5" text-anchor="middle" font-size="14" class="b">duyệt?</text><text x="498" y="2042" font-size="13" class="lbl">Có</text><path d="M 290 1187 H 40 V 840 H 208" class="loop"/><text x="282" y="1181" text-anchor="end" font-size="13" class="lbl">Không</text><text x="46" y="1146" font-size="12" class="cc">Nhà thầu chỉnh sửa</text><text x="46" y="1161" font-size="12" class="cc">phương án</text><path d="M 290 1513 H 70 V 336 H 208" class="loop"/><text x="282" y="1507" text-anchor="end" font-size="13" class="lbl">Có</text><text x="76" y="1472" font-size="12" class="cc">Sửa đổi, bổ sung</text><text x="76" y="1487" font-size="12" class="cc">nhiệm vụ khảo sát</text><path d="M 290 1967 H 100 V 1620 H 208" class="loop"/><text x="282" y="1961" text-anchor="end" font-size="13" class="lbl">Không</text><text x="106" y="1926" font-size="12" class="cc">Nhà thầu hoàn</text><text x="106" y="1941" font-size="12" class="cc">thiện báo cáo</text><line x1="490" y1="2022" x2="490" y2="2054" class="arrow"/><rect x="60" y="2058" width="980" height="99" rx="8" fill="#E6F1FB" stroke="#2F6FAE" stroke-width="1.4"/><text x="72" y="2085" class="b" font-size="15">HỒ SƠ ĐẦU RA</text><text x="72" y="2105" class="" font-size="14">• Nhiệm vụ khảo sát đã phê duyệt; phương án kỹ thuật khảo sát đã phê duyệt.</text><text x="72" y="2124" class="" font-size="14">• Báo cáo kết quả khảo sát đã phê duyệt — thành phần hồ sơ trình thẩm định dự án và hồ sơ hoàn thành công trình, lưu trữ theo quy</text><text x="72" y="2143" class="" font-size="14">định (Đ15 k3 NĐ 217).</text><rect x="60" y="2171" width="980" height="80" rx="8" fill="#EFE7FA" stroke="#6B4BA8" stroke-width="1.4"/><text x="72" y="2198" class="b" font-size="15">ĐIỀU KIỆN CHUYỂN BƯỚC</text><text x="72" y="2218" class="" font-size="14">• Thiết kế/lập dự án sử dụng kết quả khảo sát phù hợp đã được phê duyệt cho phần việc cần khảo sát (Đ22 k4 Luật 135).</text><text x="72" y="2237" class="" font-size="14">• Không phải điều kiện tuyệt đối: khảo sát bổ sung có thể phát sinh trong thiết kế hoặc thi công (Đ11 k5 điểm b, c NĐ 217).</text><rect x="60" y="2265" width="980" height="61" rx="8" fill="#FFF6D6" stroke="#B8901F" stroke-width="1.4"/><text x="72" y="2292" class="b" font-size="15">LƯU Ý PHÁP LÝ</text><text x="72" y="2312" class="" font-size="14">• Xem trang phụ lục: lưu ý pháp lý của PC-10 và danh mục nguồn chính thức.</text>
</svg>