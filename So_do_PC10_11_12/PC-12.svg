<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 2421.75" width="1100" height="2421.75" font-family="Arial, 'Segoe UI', sans-serif">
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334"/></marker></defs>
<style>
 text{fill:#1d2733}
 .title{font-size:26px;font-weight:700}
 .sub{font-size:16px;fill:#3b4a5a}
 .date{font-size:13px;fill:#6B4BA8}
 .b{font-weight:700}
 .kq{fill:#1f4e79}
 .cc{fill:#5a6573}
 .lbl{fill:#6B4BA8;font-weight:700}
 .arrow{stroke:#334;stroke-width:1.6;marker-end:url(#m)}
 .dash{stroke:#2F6FAE;stroke-width:1.3;stroke-dasharray:5 4}
 .loop{fill:none;stroke:#6B4BA8;stroke-width:1.6;stroke-dasharray:7 4;marker-end:url(#m)}
</style>
<rect width="100%" height="100%" fill="#fff"/>
<text x="550" y="44" text-anchor="middle" class="title">PC-12 · LẬP, THẨM ĐỊNH, PHÊ DUYỆT BÁO CÁO KINH TẾ – KỸ THUẬT</text><text x="550" y="72" text-anchor="middle" class="sub">Luật Xây dựng 135/2025/QH15 (Đ23, 25–28) · NĐ 217/2026/NĐ-CP (Đ27, 30, 31, 39, 73) · NĐ 206/2026/NĐ-CP (Đ5 k6, Đ7)</text><text x="550" y="96" text-anchor="middle" class="date">Ngày chốt pháp lý: 13/10/2026 · Dựng từ văn bản pháp luật — chờ đối chiếu với 03 ảnh gốc</text><rect x="90" y="124" width="22" height="16" rx="3" fill="#E6F1FB" stroke="#2F6FAE" /><text x="120" y="137" font-size="13" class="cc">Công việc</text><rect x="223" y="124" width="22" height="16" rx="3" fill="#EFE7FA" stroke="#6B4BA8" /><text x="253" y="137" font-size="13" class="cc">Điều kiện / quyết định</text><rect x="447" y="124" width="22" height="16" rx="3" fill="#FFF6D6" stroke="#B8901F" /><text x="477" y="137" font-size="13" class="cc">Lưu ý</text><rect x="552" y="124" width="22" height="16" rx="3" fill="#FFFFFF" stroke="#2F6FAE" stroke-dasharray="5 3"/><text x="582" y="137" font-size="13" class="cc">Bước tùy chọn (không bắt buộc)</text><polygon points="490,164 690,219 490,274 290,219" fill="#EFE7FA" stroke="#6B4BA8" stroke-width="1.6"/><text x="490" y="214.5" text-anchor="middle" font-size="14" class="b">Thuộc trường hợp chỉ lập BCKTKT (Đ27 k2 NĐ</text><text x="490" y="233.5" text-anchor="middle" font-size="14" class="b">217)?</text><rect x="800" y="169.25" width="280" height="99.5" rx="8" fill="#FDECEC" stroke="#C0392B"/><text x="812" y="196.25" class="" font-size="15">Phải lập Báo cáo nghiên cứu khả</text><text x="812" y="216.25" class="" font-size="15">thi — thủ tục khác, không thuộc</text><text x="812" y="236.25" class="" font-size="15">sơ đồ này.</text><text x="812" y="256.25" class="cc" font-size="12.5">Căn cứ: Đ23 k2 Luật 135</text><path d="M 690 219 H 782 V 219 H 800" fill="none" stroke="#334" stroke-width="1.6" marker-end="url(#m)"/><text x="696" y="213" font-size="13" class="lbl">Không</text><text x="498" y="294" font-size="13" class="lbl">Có</text><line x1="490" y1="274" x2="490" y2="298" class="arrow"/><rect x="210" y="302" width="560" height="242" rx="8" fill="#FFF6D6" stroke="#B8901F" stroke-width="1.4" /><text x="222" y="329" class="" font-size="15">Các trường hợp (Đ27 k2 NĐ 217): a) dự án mục đích tôn giáo; b) tổng</text><text x="222" y="349" class="" font-size="15">mức đầu tư không quá 40 tỷ đồng, KHÔNG gồm chi phí bồi thường, giải</text><text x="222" y="369" class="" font-size="15">phóng mặt bằng, tiền sử dụng đất; c) sửa chữa nhằm mục đích bảo trì</text><text x="222" y="389" class="" font-size="15">quy mô nhóm C; d) nạo vét duy tu luồng hàng hải, đường thủy nội địa;</text><text x="222" y="409" class="" font-size="15">đ) chủ yếu mua sắm hàng hóa, dịch vụ, lắp đặt thiết bị, chi phí xây</text><text x="222" y="429" class="" font-size="15">dựng (không gồm thiết bị) dưới 10% tổng mức đầu tư VÀ không quá 20 tỷ</text><text x="222" y="449" class="" font-size="15">đồng — trừ dự án quan trọng quốc gia, nhóm A, PPP.</text><text x="222" y="469" class="" font-size="15">Người QĐĐT được cho lập BCNCKT thay BCKTKT; khi đó vẫn không thẩm</text><text x="222" y="489" class="" font-size="15">định tại cơ quan chuyên môn về xây dựng (Đ27 k3). Bảo trì trên thiết</text><text x="222" y="509" class="" font-size="15">kế hiện hữu hoặc không cần thiết kế: không phải lập dự án, vẫn theo</text><text x="222" y="529" class="" font-size="15">quy định bảo trì (Đ27 k4).</text><line x1="490" y1="544" x2="490" y2="568" class="arrow"/><rect x="210" y="572" width="560" height="120" rx="8" fill="#E6F1FB" stroke="#2F6FAE" stroke-width="1.4" /><text x="222" y="599" class="b" font-size="15">12.1 · Cấp có thẩm quyền theo pháp luật về đầu tư công, đầu tư</text><text x="222" y="619" class="" font-size="15">Quyết định/chấp thuận chủ trương đầu tư — chỉ khi dự án phải có (dự</text><text x="222" y="639" class="" font-size="15">án tại Đ19 k6 Luật Đầu tư công không phải quyết định chủ trương).</text><text x="222" y="659" class="kq" font-size="15">→ Văn bản chủ trương (nếu có)</text><text x="222" y="679" class="cc" font-size="13">Căn cứ: Đ23 k5 Luật 135; Đ19 k6 Luật Đầu tư công 58/2024</text><line x1="490" y1="692" x2="490" y2="716" class="arrow"/><rect x="210" y="720" width="560" height="100" rx="8" fill="#E6F1FB" stroke="#2F6FAE" stroke-width="1.4" /><text x="222" y="747" class="b" font-size="15">12.2 · CĐT hoặc CQCBDA</text><text x="222" y="767" class="" font-size="15">Khảo sát xây dựng và nhiệm vụ thiết kế (theo hai quy trình trên).</text><text x="222" y="787" class="kq" font-size="15">→ Báo cáo khảo sát đã duyệt; nhiệm vụ thiết kế đã chấp thuận</text><text x="222" y="807" class="cc" font-size="13">Căn cứ: Đ10–17 NĐ 217</text><line x1="490" y1="820" x2="490" y2="844" class="arrow"/><rect x="210" y="848" width="560" height="180" rx="8" fill="#E6F1FB" stroke="#2F6FAE" stroke-width="1.4" /><text x="222" y="875" class="b" font-size="15">12.3 · CĐT/CQCBDA; nhà thầu tư vấn lập BCKTKT</text><text x="222" y="895" class="" font-size="15">Lập BCKTKT: thuyết minh (Đ30 k1 a–q, luôn có nội dung bảo vệ môi</text><text x="222" y="915" class="" font-size="15">trường; GPMB, PCCC "nếu có"); thiết kế bản vẽ thi công (thiết kế một</text><text x="222" y="935" class="" font-size="15">bước); thiết kế công nghệ (nếu có); tổng mức đầu tư = dự toán xây</text><text x="222" y="955" class="" font-size="15">dựng công trình + bồi thường, hỗ trợ, tái định cư (nếu có) + chi phí</text><text x="222" y="975" class="" font-size="15">liên quan chung.</text><text x="222" y="995" class="kq" font-size="15">→ Hồ sơ BCKTKT</text><text x="222" y="1015" class="cc" font-size="13">Căn cứ: Đ25 Luật 135; Đ30 NĐ 217; Đ5 k6, Đ12 NĐ 206</text><line x1="490" y1="1028" x2="490" y2="1052" class="arrow"/><polygon points="490,1056 690,1111 490,1166 290,1111" fill="#EFE7FA" stroke="#6B4BA8" stroke-width="1.6"/><text x="490" y="1116" text-anchor="middle" font-size="14" class="b">Phải thẩm tra thiết kế (Đ26 k5 Luật 135)?</text><rect x="800" y="1021.25" width="280" height="179.5" rx="8" fill="#E6F1FB" stroke="#2F6FAE"/><text x="812" y="1048.25" class="" font-size="15">Thuê tư vấn THẨM TRA thiết kế:</text><text x="812" y="1068.25" class="" font-size="15">công trình thuộc Phụ lục IV NĐ</text><text x="812" y="1088.25" class="" font-size="15">217 (HTKT cấp II trở lên), Phụ</text><text x="812" y="1108.25" class="" font-size="15">lục IX NĐ 207, hoặc thuộc diện</text><text x="812" y="1128.25" class="" font-size="15">thẩm định thiết kế PCCC (thẩm tra</text><text x="812" y="1148.25" class="" font-size="15">nội dung PCCC) → Báo cáo kết quả</text><text x="812" y="1168.25" class="" font-size="15">thẩm tra.</text><text x="812" y="1188.25" class="cc" font-size="12.5">Căn cứ: PL IV NĐ 217; PL IX NĐ 207</text><path d="M 690 1111 H 782 V 1111 H 800" fill="none" stroke="#334" stroke-width="1.6" marker-end="url(#m)"/><text x="696" y="1105" font-size="13" class="lbl">Có</text><line x1="490" y1="1166" x2="490" y2="1200.75" stroke="#334" stroke-width="1.6"/><text x="498" y="1220.75" font-size="13" class="lbl">Tiếp tục</text><line x1="490" y1="1200.75" x2="490" y2="1224.75" class="arrow"/><polygon points="490,1228.75 690,1283.75 490,1338.75 290,1283.75" fill="#EFE7FA" stroke="#6B4BA8" stroke-width="1.6"/><text x="490" y="1279.25" text-anchor="middle" font-size="14" class="b">Thuộc diện thẩm định thiết kế PCCC hoặc</text><text x="490" y="1298.25" text-anchor="middle" font-size="14" class="b">ĐTM?</text><rect x="800" y="1212.75" width="280" height="237" rx="8" fill="#E6F1FB" stroke="#2F6FAE"/><text x="812" y="1239.75" class="" font-size="15">Thủ tục chuyên ngành RIÊNG: PCCC</text><text x="812" y="1259.75" class="" font-size="15">— Công an thẩm định thiết kế bản</text><text x="812" y="1279.75" class="" font-size="15">vẽ thi công trong BCKTKT (Đ9 k1,</text><text x="812" y="1299.75" class="" font-size="15">k4 a NĐ 105; Phụ lục III thay bởi</text><text x="812" y="1319.75" class="" font-size="15">NĐ 347/2026). ĐTM — có quyết định</text><text x="812" y="1339.75" class="" font-size="15">phê duyệt kết quả thẩm định trước</text><text x="812" y="1359.75" class="" font-size="15">khi phê duyệt dự án (Đ30, 31, 36</text><text x="812" y="1379.75" class="" font-size="15">k1 d Luật BVMT sửa bởi Luật</text><text x="812" y="1399.75" class="" font-size="15">146/2025).</text><text x="812" y="1419.75" class="cc" font-size="12.5">Căn cứ: Đ9 NĐ 105 (sửa bởi NĐ</text><text x="812" y="1437.25" class="cc" font-size="12.5">347/2026); Luật BVMT</text><path d="M 690 1283.75 H 782 V 1283.75 H 800" fill="none" stroke="#334" stroke-width="1.6" marker-end="url(#m)"/><text x="696" y="1277.75" font-size="13" class="lbl">Có</text><line x1="490" y1="1338.75" x2="490" y2="1449.75" stroke="#334" stroke-width="1.6"/><text x="498" y="1469.75" font-size="13" class="lbl">Tiếp tục</text><line x1="490" y1="1449.75" x2="490" y2="1473.75" class="arrow"/><rect x="210" y="1477.75" width="560" height="160" rx="8" fill="#E6F1FB" stroke="#2F6FAE" stroke-width="1.4" /><text x="222" y="1504.75" class="b" font-size="15">12.4 · CQCBDA</text><text x="222" y="1524.75" class="" font-size="15">Trình thẩm định bằng văn bản Mẫu số 04 tới cơ quan/đơn vị được người</text><text x="222" y="1544.75" class="" font-size="15">QĐĐT giao chủ trì thẩm định (có thể là cơ quan chuyên môn trực</text><text x="222" y="1564.75" class="" font-size="15">thuộc). Không thuộc thủ tục thẩm định tại cơ quan chuyên môn về xây</text><text x="222" y="1584.75" class="" font-size="15">dựng theo Đ27 Luật 135.</text><text x="222" y="1604.75" class="kq" font-size="15">→ Hồ sơ trình thẩm định</text><text x="222" y="1624.75" class="cc" font-size="13">Căn cứ: Đ27 k2 Luật 135; Đ31 k3, k4 NĐ 217; Mẫu 04 PL I</text><line x1="490" y1="1637.75" x2="490" y2="1661.75" class="arrow"/><rect x="210" y="1665.75" width="560" height="160" rx="8" fill="#E6F1FB" stroke="#2F6FAE" stroke-width="1.4" /><text x="222" y="1692.75" class="b" font-size="15">12.5 · Cơ quan chủ trì thẩm định do người QĐĐT giao</text><text x="222" y="1712.75" class="" font-size="15">THẨM ĐỊNH: đầu tư công — Đ26 k3 Luật 135 (điểm h: an toàn công trình,</text><text x="222" y="1732.75" class="" font-size="15">công trình lân cận, giải pháp PCCC của BVTC); đầu tư kinh doanh — Đ26</text><text x="222" y="1752.75" class="" font-size="15">k4; phù hợp quy hoạch (Đ31 k6 đ); tổng mức đầu tư (Đ7 k3, k4 NĐ 206).</text><text x="222" y="1772.75" class="" font-size="15">Người QĐĐT có thể giao CĐT thẩm định nội dung điểm h (Đ31 k7 b).</text><text x="222" y="1792.75" class="kq" font-size="15">→ Thông báo kết quả thẩm định (Mẫu 06 tham khảo — xem lưu ý)</text><text x="222" y="1812.75" class="cc" font-size="13">Căn cứ: Đ26 Luật 135; Đ31 NĐ 217; Đ7 NĐ 206</text><line x1="490" y1="1825.75" x2="490" y2="1849.75" class="arrow"/><polygon points="490,1853.75 690,1908.75 490,1963.75 290,1908.75" fill="#EFE7FA" stroke="#6B4BA8" stroke-width="1.6"/><text x="490" y="1913.75" text-anchor="middle" font-size="14" class="b">Đủ điều kiện trình phê duyệt?</text><text x="498" y="1983.75" font-size="13" class="lbl">Có</text><line x1="490" y1="1963.75" x2="490" y2="1987.75" class="arrow"/><rect x="210" y="1991.75" width="560" height="120" rx="8" fill="#E6F1FB" stroke="#2F6FAE" stroke-width="1.4" /><text x="222" y="2018.75" class="b" font-size="15">12.6 · Người quyết định đầu tư</text><text x="222" y="2038.75" class="" font-size="15">PHÊ DUYỆT dự án (quyết định đầu tư xây dựng) theo Mẫu số 10; giao CĐT</text><text x="222" y="2058.75" class="" font-size="15">đóng dấu phê duyệt hồ sơ thiết kế bản vẽ thi công.</text><text x="222" y="2078.75" class="kq" font-size="15">→ Quyết định phê duyệt dự án; bản vẽ được đóng dấu</text><text x="222" y="2098.75" class="cc" font-size="13">Căn cứ: Đ28 k1 Luật 135; Đ39 k1, k5 NĐ 217</text><path d="M 290 1908.75 H 40 V 872 H 208" class="loop"/><text x="282" y="1902.75" text-anchor="end" font-size="13" class="lbl">Không</text><text x="46" y="1882.75" font-size="12" class="cc">Hoàn thiện hồ sơ BCKTKT</text><line x1="490" y1="2111.75" x2="490" y2="2143.75" class="arrow"/><rect x="60" y="2147.75" width="980" height="80" rx="8" fill="#E6F1FB" stroke="#2F6FAE" stroke-width="1.4"/><text x="72" y="2174.75" class="b" font-size="15">HỒ SƠ ĐẦU RA</text><text x="72" y="2194.75" class="" font-size="14">• Quyết định phê duyệt dự án (Mẫu số 10 Phụ lục I NĐ 217); hồ sơ thiết kế bản vẽ thi công đã đóng dấu phê duyệt; tổng mức đầu tư được</text><text x="72" y="2213.75" class="" font-size="14">phê duyệt.</text><rect x="60" y="2241.75" width="980" height="61" rx="8" fill="#EFE7FA" stroke="#6B4BA8" stroke-width="1.4"/><text x="72" y="2268.75" class="b" font-size="15">ĐIỀU KIỆN CHUYỂN BƯỚC</text><text x="72" y="2288.75" class="" font-size="14">• Lựa chọn nhà thầu thi công; giấy phép xây dựng (nếu không thuộc trường hợp miễn); khởi công khi đủ điều kiện (Đ48 Luật 135).</text><rect x="60" y="2316.75" width="980" height="61" rx="8" fill="#FFF6D6" stroke="#B8901F" stroke-width="1.4"/><text x="72" y="2343.75" class="b" font-size="15">LƯU Ý PHÁP LÝ</text><text x="72" y="2363.75" class="" font-size="14">• Xem trang phụ lục: lưu ý pháp lý của PC-12 và danh mục nguồn chính thức.</text>
</svg>