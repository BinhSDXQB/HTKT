<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1719.5" width="1100" height="1719.5" font-family="Arial, 'Segoe UI', sans-serif">
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334"/></marker></defs>
<style>
 text{fill:#1d2733}
 .title{font-size:26px;font-weight:700}
 .sub{font-size:16px;fill:#3b4a5a}
 .date{font-size:13px;fill:#6B4BA8}
 .b{font-weight:700}
 .kq{fill:#1f4e79}
 .cc{fill:#5a6573}
 .lbl{fill:#6B4BA8;font-weight:700}
 .arrow{stroke:#334;stroke-width:1.6;marker-end:url(#m)}
 .dash{stroke:#2F6FAE;stroke-width:1.3;stroke-dasharray:5 4}
 .loop{fill:none;stroke:#6B4BA8;stroke-width:1.6;stroke-dasharray:7 4;marker-end:url(#m)}
</style>
<rect width="100%" height="100%" fill="#fff"/>
<text x="550" y="44" text-anchor="middle" class="title">PC-11 · LẬP VÀ CHẤP THUẬN NHIỆM VỤ THIẾT KẾ XÂY DỰNG</text><text x="550" y="72" text-anchor="middle" class="sub">Luật Xây dựng 135/2025/QH15 (Đ19, 20) · NĐ 217/2026/NĐ-CP (Đ8, 11 k5, 16, 17)</text><text x="550" y="96" text-anchor="middle" class="date">Ngày chốt pháp lý: 13/10/2026 · Dựng từ văn bản pháp luật — chờ đối chiếu với 03 ảnh gốc</text><rect x="90" y="124" width="22" height="16" rx="3" fill="#E6F1FB" stroke="#2F6FAE" /><text x="120" y="137" font-size="13" class="cc">Công việc</text><rect x="223" y="124" width="22" height="16" rx="3" fill="#EFE7FA" stroke="#6B4BA8" /><text x="253" y="137" font-size="13" class="cc">Điều kiện / quyết định</text><rect x="447" y="124" width="22" height="16" rx="3" fill="#FFF6D6" stroke="#B8901F" /><text x="477" y="137" font-size="13" class="cc">Lưu ý</text><rect x="552" y="124" width="22" height="16" rx="3" fill="#FFFFFF" stroke="#2F6FAE" stroke-dasharray="5 3"/><text x="582" y="137" font-size="13" class="cc">Bước tùy chọn (không bắt buộc)</text><rect x="210" y="164" width="560" height="140" rx="8" fill="#E6F1FB" stroke="#2F6FAE" stroke-width="1.4" /><text x="222" y="191" class="b" font-size="15">11.1 · CĐT hoặc CQCBDA</text><text x="222" y="211" class="" font-size="15">Tập hợp căn cứ: chủ trương đầu tư (nếu có); quy hoạch làm căn cứ lập</text><text x="222" y="231" class="" font-size="15">dự án; thông tin địa điểm; kết quả khảo sát sẵn có (nếu có); yêu cầu</text><text x="222" y="251" class="" font-size="15">thi tuyển phương án kiến trúc (nếu thuộc diện).</text><text x="222" y="271" class="kq" font-size="15">→ Bộ căn cứ lập nhiệm vụ</text><text x="222" y="291" class="cc" font-size="13">Căn cứ: Đ17 k2, k3 a NĐ 217; Đ26 NĐ 217; Đ17 Luật Kiến trúc</text><line x1="490" y1="304" x2="490" y2="328" class="arrow"/><rect x="210" y="332" width="560" height="180" rx="8" fill="#E6F1FB" stroke="#2F6FAE" stroke-width="1.4" /><text x="222" y="359" class="b" font-size="15">11.2 · CĐT/CQCBDA lập, hoặc thuê tổ chức, cá nhân có kinh nghiệm</text><text x="222" y="379" class="b" font-size="15">thiết kế</text><text x="222" y="399" class="" font-size="15">Lập nhiệm vụ thiết kế: căn cứ; mục tiêu; địa điểm; yêu cầu quy hoạch,</text><text x="222" y="419" class="" font-size="15">cảnh quan, kiến trúc; quy mô, thời hạn sử dụng, công năng, tiêu</text><text x="222" y="439" class="" font-size="15">chuẩn, công nghệ; chỉ dẫn kỹ thuật; thông tin BIM. Thiết kế FEED:</text><text x="222" y="459" class="" font-size="15">thêm nội dung Đ17 k4.</text><text x="222" y="479" class="kq" font-size="15">→ Dự thảo nhiệm vụ thiết kế</text><text x="222" y="499" class="cc" font-size="13">Căn cứ: Đ17 k1, k3, k4 NĐ 217</text><line x1="490" y1="512" x2="490" y2="536" class="arrow"/><polygon points="490,540 690,595 490,650 290,595" fill="#EFE7FA" stroke="#6B4BA8" stroke-width="1.6"/><text x="490" y="600" text-anchor="middle" font-size="14" class="b">Công trình xây mới từ cấp II trở lên?</text><rect x="800" y="505.25" width="280" height="179.5" rx="8" fill="#E6F1FB" stroke="#2F6FAE"/><text x="812" y="532.25" class="" font-size="15">BẮT BUỘC áp dụng BIM từ giai đoạn</text><text x="812" y="552.25" class="" font-size="15">lập BCNCKT/BCKTKT → nhiệm vụ</text><text x="812" y="572.25" class="" font-size="15">thiết kế nêu yêu cầu thông tin</text><text x="812" y="592.25" class="" font-size="15">BIM. Người QĐĐT được quyết định</text><text x="812" y="612.25" class="" font-size="15">không áp dụng với công trình theo</text><text x="812" y="632.25" class="" font-size="15">tuyến, khu vực đặc thù, dự án cần</text><text x="812" y="652.25" class="" font-size="15">bảo mật. (Không: khuyến khích)</text><text x="812" y="672.25" class="cc" font-size="12.5">Căn cứ: Đ8 k1 NĐ 217</text><path d="M 690 595 H 782 V 595 H 800" fill="none" stroke="#334" stroke-width="1.6" marker-end="url(#m)"/><text x="696" y="589" font-size="13" class="lbl">Có</text><line x1="490" y1="650" x2="490" y2="684.75" stroke="#334" stroke-width="1.6"/><text x="498" y="704.75" font-size="13" class="lbl">Tiếp tục</text><line x1="490" y1="684.75" x2="490" y2="708.75" class="arrow"/><rect x="210" y="712.75" width="560" height="100" rx="8" fill="#FFFFFF" stroke="#2F6FAE" stroke-width="1.4" stroke-dasharray="6 4"/><text x="222" y="739.75" class="b" font-size="15">11.3 (tùy chọn) · Tổ chức tư vấn, chuyên gia do CĐT thuê</text><text x="222" y="759.75" class="" font-size="15">GÓP Ý hoặc THẨM TRA nhiệm vụ thiết kế — "được thuê", không bắt buộc.</text><text x="222" y="779.75" class="kq" font-size="15">→ Ý kiến góp ý/thẩm tra</text><text x="222" y="799.75" class="cc" font-size="13">Căn cứ: Đ17 k2 NĐ 217</text><line x1="490" y1="812.75" x2="490" y2="836.75" class="arrow"/><rect x="210" y="840.75" width="560" height="120" rx="8" fill="#E6F1FB" stroke="#2F6FAE" stroke-width="1.4" /><text x="222" y="867.75" class="b" font-size="15">11.4 · CĐT hoặc cơ quan được giao nhiệm vụ chuẩn bị dự án</text><text x="222" y="887.75" class="" font-size="15">CHẤP THUẬN bằng văn bản hoặc PHÊ DUYỆT TRỰC TIẾP tại nhiệm vụ thiết</text><text x="222" y="907.75" class="" font-size="15">kế.</text><text x="222" y="927.75" class="kq" font-size="15">→ Nhiệm vụ thiết kế được chấp thuận/phê duyệt</text><text x="222" y="947.75" class="cc" font-size="13">Căn cứ: Đ17 k6 NĐ 217</text><line x1="490" y1="960.75" x2="490" y2="984.75" class="arrow"/><polygon points="490,988.75 690,1043.75 490,1098.75 290,1043.75" fill="#EFE7FA" stroke="#6B4BA8" stroke-width="1.6"/><text x="490" y="1048.75" text-anchor="middle" font-size="14" class="b">Nhiệm vụ thiết kế đạt yêu cầu?</text><text x="498" y="1118.75" font-size="13" class="lbl">Có</text><line x1="490" y1="1098.75" x2="490" y2="1122.75" class="arrow"/><polygon points="490,1126.75 690,1181.75 490,1236.75 290,1181.75" fill="#EFE7FA" stroke="#6B4BA8" stroke-width="1.6"/><text x="490" y="1177.25" text-anchor="middle" font-size="14" class="b">Phát sinh yêu cầu khảo sát mới (do nhiệm</text><text x="490" y="1196.25" text-anchor="middle" font-size="14" class="b">vụ thiết kế thay đổi)?</text><rect x="800" y="1122" width="280" height="119.5" rx="8" fill="#E6F1FB" stroke="#2F6FAE"/><text x="812" y="1149" class="" font-size="15">Sửa đổi, bổ sung nhiệm vụ khảo</text><text x="812" y="1169" class="" font-size="15">sát → thực hiện theo quy trình</text><text x="812" y="1189" class="" font-size="15">Khảo sát xây dựng; kết quả quay</text><text x="812" y="1209" class="" font-size="15">lại phục vụ thiết kế.</text><text x="812" y="1229" class="cc" font-size="12.5">Căn cứ: Đ11 k5 a NĐ 217</text><path d="M 690 1181.75 H 782 V 1181.75 H 800" fill="none" stroke="#334" stroke-width="1.6" marker-end="url(#m)"/><text x="696" y="1175.75" font-size="13" class="lbl">Có</text><line x1="490" y1="1236.75" x2="490" y2="1241.5" stroke="#334" stroke-width="1.6"/><text x="498" y="1261.5" font-size="13" class="lbl">Không</text><line x1="490" y1="1241.5" x2="490" y2="1265.5" class="arrow"/><rect x="210" y="1269.5" width="560" height="140" rx="8" fill="#E6F1FB" stroke="#2F6FAE" stroke-width="1.4" /><text x="222" y="1296.5" class="b" font-size="15">11.5 · CĐT hoặc CQCBDA</text><text x="222" y="1316.5" class="" font-size="15">Dùng nhiệm vụ thiết kế làm căn cứ lập dự án (BCNCKT/BCKTKT) và lập</text><text x="222" y="1336.5" class="" font-size="15">thiết kế. Khi cần đáp ứng điều kiện thực tế, sửa đổi, bổ sung nhiệm</text><text x="222" y="1356.5" class="" font-size="15">vụ rồi chấp thuận lại.</text><text x="222" y="1376.5" class="kq" font-size="15">→ Căn cứ lập dự án, thiết kế</text><text x="222" y="1396.5" class="cc" font-size="13">Căn cứ: Đ17 k2, k5 NĐ 217; Đ20 k1 Luật 135</text><path d="M 290 1043.75 H 40 V 356 H 208" class="loop"/><text x="282" y="1037.75" text-anchor="end" font-size="13" class="lbl">Không</text><text x="46" y="1002.75" font-size="12" class="cc">Hoàn thiện nhiệm vụ</text><text x="46" y="1017.75" font-size="12" class="cc">thiết kế</text><line x1="490" y1="1409.5" x2="490" y2="1441.5" class="arrow"/><rect x="60" y="1445.5" width="980" height="61" rx="8" fill="#E6F1FB" stroke="#2F6FAE" stroke-width="1.4"/><text x="72" y="1472.5" class="b" font-size="15">HỒ SƠ ĐẦU RA</text><text x="72" y="1492.5" class="" font-size="14">• Nhiệm vụ thiết kế được chấp thuận bằng văn bản hoặc được phê duyệt trực tiếp tại nhiệm vụ (Đ17 k6 NĐ 217).</text><rect x="60" y="1520.5" width="980" height="80" rx="8" fill="#EFE7FA" stroke="#6B4BA8" stroke-width="1.4"/><text x="72" y="1547.5" class="b" font-size="15">ĐIỀU KIỆN CHUYỂN BƯỚC</text><text x="72" y="1567.5" class="" font-size="14">• Lập dự án/thiết kế khi đã có nhiệm vụ thiết kế được chấp thuận; thiết kế phải phù hợp nhiệm vụ thiết kế (Đ20 k1 Luật 135).</text><text x="72" y="1586.5" class="" font-size="14">• Nhiệm vụ thiết kế phù hợp chủ trương đầu tư "nếu có" — không phải dự án nào cũng có quyết định chủ trương (Đ17 k2 NĐ 217).</text><rect x="60" y="1614.5" width="980" height="61" rx="8" fill="#FFF6D6" stroke="#B8901F" stroke-width="1.4"/><text x="72" y="1641.5" class="b" font-size="15">LƯU Ý PHÁP LÝ</text><text x="72" y="1661.5" class="" font-size="14">• Xem trang phụ lục: lưu ý pháp lý của PC-11 và danh mục nguồn chính thức.</text>
</svg>